name: Build Tizen .wgt

# Manual runs (Actions → Run workflow) produce a downloadable artifact to
# sideload onto the TV. A tag push builds the same and cuts a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      # Manual runs only — a tag push has no inputs and is always a release.
      # `test` deliberately ignores the distributor secrets and signs with
      # Tizen's bundled TEST distributor. Apps2Samsung installs such a package,
      # but the standard install path rejects it: never publish one.
      signing:
        description: 'Distributor certificate to sign with'
        type: choice
        options:
          - real
          - test
        default: real
      # Tizen identifies an installed app by its package id, not its signature.
      # `test` suffixes both ids, so the artifact can be installed beside the
      # main app instead of replacing it; `signing=test` is the usual pair.
      variant:
        description: 'App identity (test installs alongside the main app)'
        type: choice
        options:
          - main
          - test
        default: main
  push:
    tags:
      - 'v*'

# The build only reads. Write access belongs to the release job alone, so a
# compromised dependency lifecycle script cannot push with the workspace token.
permissions:
  contents: read

# One run per ref. A second tag push (or a dispatch racing one) must not
# interleave two sets of release assets; the newer run wins, the older is not
# cancelled mid-signing.
concurrency:
  group: build-wgt-${{ github.ref }}
  cancel-in-progress: false

env:
  # Name of the Tizen security profile generated at build time. Must match the
  # `-s` argument to `tizen package`; it is not related to any profile that may
  # exist on your VM.
  PROFILE_NAME: stashzen

  # Tizen Studio 5.1 CLI-only ("web-cli") installer: it installs headlessly,
  # which is what makes CI signing possible — the full SDK is GUI-driven. If
  # this URL 404s, find a newer tizen-studio_* dir under
  # https://download.tizen.org/sdk/Installer/ and update this and the cache key.
  TIZEN_BIN: tizen-studio_5.1.bin
  # HTTPS, not HTTP: this installer is executed in the same job that later
  # handles the signing keys.
  TIZEN_URL: https://download.tizen.org/sdk/Installer/tizen-studio_5.1/web-cli_Tizen_Studio_5.1_ubuntu-64.bin
  # Pinned digest of that exact file. If the URL is ever updated, update this
  # too — the build must fail closed when the mirror serves something else.
  TIZEN_SHA256: b31bf32bfde19f8b74cc5a8edb13b8478ae0533e439d61f9ba430b87d1c86717

jobs:
  build:
    name: Build and sign
    # Pinned, not `ubuntu-latest`: that label is migrating to Ubuntu 26, and the
    # Tizen Studio web-cli installer is the fragile step here. Move this on
    # purpose, not in the middle of a release.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      # `main` or `test`; a tag push has no inputs and is always main.
      variant: ${{ steps.version.outputs.variant }}
      # The mode actually used to sign. `release` refuses a test-signed build.
      signing: ${{ steps.signing.outputs.mode }}

    # Load-bearing: the signing secrets live in a GitHub *environment*, and a
    # job only sees them if it names it here. Without this line they resolve to
    # empty and signing fails. The environment is named StashZen, same as the
    # public repo.
    environment: StashZen

    steps:
      # Pinned by commit SHA, not tag: a moved or compromised tag cannot change
      # what runs here. There is no Dependabot config, so bump the SHA and the
      # version comment together by hand.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      # The `tizen` CLI shells out to Java for packaging and signing. The 5.1
      # toolchain predates the JDK the runner image ships by default, so pin an
      # era-appropriate one.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '11'

      # The CLI download is ~1.5 GB, so cache both the installer and the
      # installed tree. The key carries the pinned digest: a new SDK URL or
      # checksum gets a fresh tree instead of silently reusing the old one.
      - name: Cache Tizen Studio CLI
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: tizen-studio-5.1-web-cli-${{ env.TIZEN_SHA256 }}
          path: |
            ${{ github.workspace }}/${{ env.TIZEN_BIN }}
            ${{ github.workspace }}/tizen-studio

      - name: Install Tizen Studio CLI
        run: |
          set -euo pipefail
          TIZEN_STUDIO="$GITHUB_WORKSPACE/tizen-studio"
          INSTALLER="$GITHUB_WORKSPACE/$TIZEN_BIN"

          if [ -x "$TIZEN_STUDIO/tools/ide/bin/tizen" ]; then
            echo "Tizen Studio restored from cache."
          else
            if [ ! -s "$INSTALLER" ]; then
              # --proto covers the first request only; redirects have their own
              # switch, and its default still allows a downgrade to HTTP on a
              # download that is chmod +x'd and run.
              curl -fL --proto '=https' --proto-redir '=https' --retry 3 --retry-delay 2 \
                -o "$INSTALLER" "$TIZEN_URL"
            fi
            # Verify before executing, cached installer included. `sha256sum -c`
            # names the file on failure without printing either digest.
            echo "$TIZEN_SHA256  $INSTALLER" | sha256sum -c -
            chmod +x "$INSTALLER"
            # --accept-license makes the otherwise-interactive installer silent.
            "$INSTALLER" --accept-license "$TIZEN_STUDIO"
          fi

          "$TIZEN_STUDIO/tools/ide/bin/tizen" version
          echo "$TIZEN_STUDIO/tools/ide/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # A separate step so a lint failure is its own red X in the run summary
      # rather than buried in the build log — and so a plugin upgrade that
      # starts flagging something cannot reach a release unnoticed.
      - name: Lint
        run: npm run lint

      # The offline checks that run without a browser: filter translation and
      # the bundle-leak guard's tests. The headless harness is too heavy here
      # and stays a pre-release, local gate.
      - name: Test
        run: npm test

      # Deliberately does NOT receive the signing secrets, and no .env.production
      # exists in CI (gitignored), so nothing of your Stash server ends up in the
      # released bundle. The only VITE_ variables set here are the public-only
      # update and changelog URLs below, neither of which is a credential. See
      # the guard step below.
      - name: Build web app
        id: version
        env:
          # Empty on a tag push (no inputs); main is the release identity.
          APP_VARIANT: "${{ inputs.variant || 'main' }}"
          # Both locks for the public-only update check. `github.repository` is
          # evaluated per step, so this file is identical in both repos: true in
          # the public copy, false in the private one. A private build gets an
          # empty URL too, so api.github.com is never inlined.
          VITE_UPDATE_CHECK: "${{ github.repository == 'Stashified/StashZen' && 'true' || 'false' }}"
          VITE_UPDATE_CHECK_URL: "${{ github.repository == 'Stashified/StashZen' && 'https://api.github.com/repos/Stashified/StashZen/releases/latest' || '' }}"
          # The changelog is the second half of that public pair: same lock,
          # separate URL (the app fetches the raw file on demand).
          VITE_CHANGELOG_URL: "${{ github.repository == 'Stashified/StashZen' && 'https://raw.githubusercontent.com/Stashified/StashZen/main/changelog.json' || '' }}"
        run: |
          set -euo pipefail

          # Tag builds take the version from the tag; manual runs use
          # package.json. Tizen compares widget versions on update, so a
          # release stuck at 0.1.0 would never look new to the TV.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          # Tizen wants a dotted numeric version. A prerelease tag would reach
          # `sed` and then fail at packaging, far from the mistake.
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::Version '$VERSION' is not a dotted numeric version (expected 1.2.3 or 1.2.3.4)"
            exit 1
          fi
          # The release body is rendered from changelog.json, so a tag with no
          # entry would publish empty notes. A manual build only needs the file
          # to parse.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node scripts/publish-changelog.mjs body --version "$VERSION" >/dev/null
          else
            node scripts/publish-changelog.mjs validate
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The release job names the artifact from these outputs, so they are
          # computed here rather than in the consumer.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The suffix travels with the artifact name and the .wgt filename, so
          # two dispatches for one version cannot be confused after download.
          case "$APP_VARIANT" in
            main) VARIANT_SUFFIX="" ;;
            test) VARIANT_SUFFIX="-test" ;;
            *)
              echo "::error::Unknown variant '$APP_VARIANT' (expected main or test)"
              exit 1
              ;;
          esac
          echo "VARIANT=$APP_VARIANT" >> "$GITHUB_ENV"
          echo "VARIANT_SUFFIX=$VARIANT_SUFFIX" >> "$GITHUB_ENV"
          echo "variant=$APP_VARIANT" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION ($APP_VARIANT identity)"

          # Stamp before the build so vite's __APP_VERSION__ picks it up, then
          # verify: a reformatted package.json would leave the old version and
          # the release would ship it.
          sed -i -E "s|(\"version\":[[:space:]]*\")[^\"]*(\")|\1${VERSION}\2|" package.json
          STAMPED="$(node -p "require('./package.json').version")"
          if [ "$STAMPED" != "$VERSION" ]; then
            echo "::error::package.json still says $STAMPED after stamping $VERSION"
            exit 1
          fi

          npm run build

          # Stage the Tizen manifest and icons alongside the built assets.
          # `config.xml` names `icon-black.png`; the transparent original is
          # staged too, so swapping the manifest line back is all it takes.
          cp tizen/config.xml dist/
          cp tizen/icon.png dist/
          cp tizen/icon-black.png dist/
          # Multiline-aware, and it fails if the attribute cannot be found;
          # the old sed left the old version silently. APP_VARIANT from the
          # step env also swaps the package id for the side-by-side variant.
          node scripts/stamp-manifest.mjs dist/config.xml

      # `npm run build` already ran this as its postbuild step. It runs again so
      # the credential check has its own named step in the summary, and a future
      # change to the build script cannot quietly drop it.
      - name: Guard against leaked credentials
        # Repeated, not inherited: env does not flow between steps. The guard
        # allows the GitHub API URL only when the update check is armed.
        env:
          VITE_UPDATE_CHECK: "${{ github.repository == 'Stashified/StashZen' && 'true' || 'false' }}"
          VITE_UPDATE_CHECK_URL: "${{ github.repository == 'Stashified/StashZen' && 'https://api.github.com/repos/Stashified/StashZen/releases/latest' || '' }}"
          VITE_CHANGELOG_URL: "${{ github.repository == 'Stashified/StashZen' && 'https://raw.githubusercontent.com/Stashified/StashZen/main/changelog.json' || '' }}"
        run: node scripts/check-bundle.mjs

      # The TV floor: JS is checked from source and CSS from the bundle built
      # above, so this has to run after "Build web app". The target engine and
      # the reason for it live in scripts/compat-floor.mjs.
      - name: Compatibility floor (Tizen 6.5)
        run: npm run check:compat

      # Turns the certificate secrets into a profiles.xml; signing is entirely
      # profile-driven, so this is all that stands between a bare CLI and a
      # signed .wgt — no Certificate Manager / GUI step.
      #
      # It runs *last*, after install, lint, test and build, so the key material
      # exists only between here and `tizen package`; earlier would leave a
      # readable private key on disk while dependency scripts run.
      - name: Generate signing profile
        id: signing
        env:
          TIZEN_AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12 }}
          TIZEN_AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          TIZEN_DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12 }}
          TIZEN_DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
          # Empty on a tag push (no inputs) and therefore `real`.
          SIGNING_MODE: ${{ inputs.signing || 'real' }}
        run: |
          set -euo pipefail
          # The profile holds both passwords and the keys are unencrypted; the
          # default 0644 would leave them readable to anything later in the job.
          umask 077

          echo "mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"

          # A test-signed package cannot be published, so refuse before any key
          # is unpacked. The warning further down is for manual runs on a
          # branch; a tag dispatch with signing=test lands here.
          if [ "$SIGNING_MODE" = "test" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::signing=test on tag $GITHUB_REF_NAME. The artifact would carry Tizen's TEST distributor, which the standard install path rejects; use signing=real or run it on a branch."
            exit 1
          fi

          TIZEN_STUDIO="$GITHUB_WORKSPACE/tizen-studio"
          CERTS="$TIZEN_STUDIO/tools/certificate-generator/certificates"
          WORK="$RUNNER_TEMP/signing"
          mkdir -p "$WORK"

          xml_escape() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' \
                                     -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'
          }

          # ── Author key (required) ───────────────────────────────────────
          if [ -z "${TIZEN_AUTHOR_P12:-}" ]; then
            echo "::error::Secret TIZEN_AUTHOR_P12 is not set — see README → Releases."
            exit 1
          fi
          printf '%s' "$TIZEN_AUTHOR_P12" | base64 -d > "$WORK/author.p12"

          AUTHOR_CERT="$CERTS/developer/tizen-developer-ca.cer"
          AUTHOR_KEY="$WORK/author.p12"
          AUTHOR_PASSWORD="$TIZEN_AUTHOR_PASSWORD"

          # ── Distributor key ─────────────────────────────────────────────
          # Required for the normal install path. The fallback is Tizen's *test*
          # distributor (its chain roots at "Tizen Test CA" under O=Tizen Test
          # CA), and `tizen install` refuses such a package; Apps2Samsung accepts
          # it. So the fallback stays for manual runs, but a release must not
          # depend on it. A real Samsung distributor certificate comes from Tizen
          # Studio's Certificate Manager: it is issued against your Samsung
          # account and embeds the DUID(s) of the TVs allowed to install.
          #
          # On a tag build the fallback is refused outright: a published release
          # signed with a test certificate looks like it succeeded while users
          # installing the normal way get a failure — worse than a red run.
          if [ "$SIGNING_MODE" = "test" ]; then
            # Deliberate: the environment may well hold a real Samsung
            # distributor pair, and this mode exists precisely to ignore it.
            echo "::warning::signing=test — ignoring the distributor secrets and using Tizen's TEST distributor. Apps2Samsung accepts this signature (verified 2026-10-24) but the standard install path does not; the artifact is for experimentation only and must not be published."
            DIST_KEY="$CERTS/distributor/sdk-public/tizen-distributor-signer.p12"
            DIST_PASSWORD="tizenpkcs12passfordsigner"
          elif [ -n "${TIZEN_DISTRIBUTOR_P12:-}" ]; then
            printf '%s' "$TIZEN_DISTRIBUTOR_P12" | base64 -d > "$WORK/distributor.p12"
            DIST_KEY="$WORK/distributor.p12"
            DIST_PASSWORD="$TIZEN_DISTRIBUTOR_PASSWORD"
          else
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::No distributor signing secrets on tag $GITHUB_REF_NAME. The release would carry Tizen's TEST distributor, which the standard install path rejects; refusing to publish it."
              exit 1
            fi
            echo "::warning::No distributor secrets set — falling back to Tizen's TEST distributor. The standard install path rejects a test-signed .wgt; this artifact is for exercising the pipeline, not for distribution."
            DIST_KEY="$CERTS/distributor/sdk-public/tizen-distributor-signer.p12"
            DIST_PASSWORD="tizenpkcs12passfordsigner"
          fi
          DIST_CERT="$CERTS/distributor/sdk-public/tizen-distributor-ca.cer"

          for f in "$AUTHOR_CERT" "$DIST_CERT" "$DIST_KEY"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing signing file: $f"
              echo "The web-cli install may not include certificate-generator; list what is there:"
              ls -R "$CERTS" 2>/dev/null || echo "(no $CERTS)"
              exit 1
            fi
          done

          # ── profiles.xml ────────────────────────────────────────────────
          PROFILES_PATH="$(tizen cli-config -l | sed -n 's/^default\.profiles\.path=//p' | tr -d '\r')"
          if [ -z "$PROFILES_PATH" ]; then
            PROFILES_PATH="$HOME/tizen-studio-data/profile/profiles.xml"
            tizen cli-config -g "default.profiles.path=$PROFILES_PATH"
          fi

          # Unconditional, and it must stay that way. Tizen's data directory is
          # a sibling of tizen-studio/ and is NOT cached, so on a cache hit the
          # install step is skipped and never creates it, even though
          # `cli-config -l` reports a path inside. mkdir -p also makes the parent.
          mkdir -p "$(dirname "$PROFILES_PATH")"

          echo "Writing profile '$PROFILE_NAME' to $PROFILES_PATH"

          cat > "$PROFILES_PATH" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <profiles active="$PROFILE_NAME" version="3.1">
              <profile name="$PROFILE_NAME">
                  <profileitem ca="$(xml_escape "$AUTHOR_CERT")" distributor="0" key="$(xml_escape "$AUTHOR_KEY")" password="$(xml_escape "$AUTHOR_PASSWORD")" rootca=""/>
                  <profileitem ca="$(xml_escape "$DIST_CERT")" distributor="1" key="$(xml_escape "$DIST_KEY")" password="$(xml_escape "$DIST_PASSWORD")" rootca=""/>
                  <profileitem ca="" distributor="2" key="" password="" rootca=""/>
              </profile>
          </profiles>
          EOF

          tizen security-profiles list

      - name: Package and sign .wgt
        run: |
          set -euo pipefail

          tizen package -t wgt -s "$PROFILE_NAME" -- ./dist

          WGT="$(find dist -maxdepth 1 -name '*.wgt' | head -1)"
          [ -n "$WGT" ] || WGT="$(find . -maxdepth 1 -name '*.wgt' | head -1)"
          if [ -z "$WGT" ]; then
            echo "::error::tizen package produced no .wgt"
            exit 1
          fi

          OUT="StashZen-${VERSION}${VARIANT_SUFFIX}.wgt"
          mv "$WGT" "$OUT"
          echo "WGT=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

          # A .wgt is a zip; confirm the manifest and entry point really made it
          # in. One listing, because `grep -q` on a big archive exits early and
          # SIGPIPE kills unzip under pipefail.
          LISTING="$(unzip -l "$OUT")"
          printf '%s\n' "$LISTING"
          grep -q 'config.xml' <<<"$LISTING" || { echo "::error::.wgt has no config.xml"; exit 1; }
          grep -q 'index.html' <<<"$LISTING" || { echo "::error::.wgt has no index.html"; exit 1; }

      # The keys and profiles.xml are past their use once packaging is done.
      # `always()` so a failed package cannot leave them for later steps.
      - name: Remove signing material
        if: always()
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/signing"
          PROFILES_PATH="$(tizen cli-config -l 2>/dev/null \
            | sed -n 's/^default\.profiles\.path=//p' | tr -d '\r' || true)"
          if [ -n "$PROFILES_PATH" ]; then
            rm -f "$PROFILES_PATH"
          fi
          rm -f "$HOME/tizen-studio-data/profile/profiles.xml"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StashZen-${{ env.VERSION }}${{ env.VARIANT_SUFFIX }}-wgt
          path: ${{ env.WGT }}
          if-no-files-found: error

  # Publishing is a separate job only so write access can be scoped to it: the
  # build job runs `npm ci` and every dependency lifecycle script, and a
  # workflow-level `contents: write` would leave the repository token able to
  # push during all of that. Only `gh` runs here.
  release:
    name: Publish GitHub Release
    needs: build
    # Belt and braces: the signing step refuses test mode on a tag, and this
    # keeps a future edit to that step from publishing the result. Positive
    # assertions, so an unset output blocks rather than passes.
    if: >-
      github.event_name == 'push'
      && github.ref_type == 'tag'
      && needs.build.outputs.signing == 'real'
      && needs.build.outputs.variant == 'main'
    # Same image as the build job: an artifact produced there is downloaded and
    # unzipped here, so the two must not drift onto different Ubuntu releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Pinned by SHA like every other action here. This is the download half
      # of the artifact pair; upload-artifact above is v7.0.2.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: StashZen-${{ needs.build.outputs.version }}-wgt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no checkout in this job, so `gh` has no git remote to
          # infer the repository from. Name it explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"

          # The artifact carries exactly one file at the workspace root. Find
          # it rather than reconstructing the name, so a change to the naming
          # scheme in the build job cannot silently make the release empty.
          WGT="$(find . -maxdepth 1 -name '*.wgt' | head -1)"
          if [ -z "$WGT" ]; then
            echo "::error::download-artifact restored no .wgt — refusing to publish an empty release."
            exit 1
          fi

          # The release body comes from the tagged changelog.json, the same file
          # the app fetches. The build job already proved the entry exists; this
          # renders it rather than trusting --generate-notes, which would list
          # commits instead of user-facing changes.
          VERSION="${GITHUB_REF_NAME#v}"
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/changelog.json?ref=$TAG" \
            > "$RUNNER_TEMP/changelog.json"
          # Compare like the app and the build gate do: 0.44 and 0.44.0 are one
          # version, so an exact string match could miss the entry.
          # parseVersionTag's reading: trim, drop a -rc1/+build suffix, then
          # split. A raw tonumber errors out on those, after the build is green.
          jq -r --arg v "$VERSION" '
            def vkey: sub("^[vV]"; "") | sub("[-+].*$"; "") | gsub("^\\s+|\\s+$"; "")
              | split(".") | map(tonumber) | . + [0, 0, 0, 0] | .[0:4];
            ([.releases[] | select((.version | vkey) == ($v | vkey))][0]) as $r
            | if $r == null then empty
              else $r.sections[]
                | "## " + .title + "\n\n"
                  + ([.items[] | "- " + .] | join("\n")) + "\n"
              end' "$RUNNER_TEMP/changelog.json" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::changelog.json has no entry for $VERSION — refusing to publish empty notes."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — refreshing the notes and asset."
            # A re-cut must not keep the previous body.
            gh release edit "$TAG" --title "StashZen $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" "$WGT" --clobber
          else
            gh release create "$TAG" "$WGT" --title "StashZen $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
